name: Nightly Benchmark

# v1.1 (#144): 升级为 nightly schedule + 加入 4 新 bench(agent_dispatch / vault_unlock /
# chat_e2e / plugin_install)。原 bench.yml weekly schedule 已合并至此 workflow。
# 安全说明:本 workflow 不消费任何用户可控输入(无 issue / PR title / comment body)。
# 仅用 github.sha (系统提供) + secrets.GITHUB_TOKEN (token),无注入面。
on:
  schedule:
    # Nightly 04:00 UTC（北京 12:00，避开高负载时段）
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nightly-bench.yml'

jobs:
  bench:
    name: Run criterion benchmarks (v1.0 base + v1.1 new)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nightly-bench-${{ runner.os }}-
            bench-${{ runner.os }}-

      # CI uses the git dep; swap out local path dep when present
      - name: Use git dep for attune-core
        run: |
          sed -i 's|attune-core = { path = .*}|attune-core = { git = "https://github.com/qiurui144/attune", branch = "develop" }|' Cargo.toml
          grep attune-core Cargo.toml

      # === v1.0 base bench (#131) ===
      - name: Run token_savings bench
        run: cargo bench --bench token_savings 2>&1 | tee /tmp/token_savings.txt

      - name: Run encrypt_overhead bench
        run: cargo bench --bench encrypt_overhead 2>&1 | tee /tmp/encrypt_overhead.txt

      - name: Run retrieval_accuracy bench
        run: cargo bench --bench retrieval_accuracy 2>&1 | tee /tmp/retrieval_accuracy.txt

      - name: Run hdbscan_accuracy bench
        run: cargo bench --bench hdbscan_accuracy 2>&1 | tee /tmp/hdbscan_accuracy.txt

      # === v1.1 新 bench (#144) ===
      - name: Run agent_dispatch bench
        run: cargo bench --bench agent_dispatch 2>&1 | tee /tmp/agent_dispatch.txt

      - name: Run vault_unlock bench
        run: cargo bench --bench vault_unlock 2>&1 | tee /tmp/vault_unlock.txt

      - name: Run chat_e2e bench
        run: cargo bench --bench chat_e2e 2>&1 | tee /tmp/chat_e2e.txt

      - name: Run plugin_install bench
        run: cargo bench --bench plugin_install 2>&1 | tee /tmp/plugin_install.txt

      - name: Upload criterion HTML report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ github.sha }}
          path: target/criterion/
          retention-days: 90

      - name: Upload bench logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-logs-${{ github.sha }}
          path: /tmp/*.txt
          retention-days: 30

      # GH Pages dashboard (history tracking via github-action-benchmark)
      # 注：首次启用前需在 repo Settings → Pages 启用 GitHub Pages (source: gh-pages branch)
      # 当前默认 best-effort(continue-on-error),避免初次 push 因 Pages 未启用 fail
      - name: Publish bench history to GH Pages (best-effort)
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: attune-bench v1.0 + v1.1
          tool: 'cargo'
          output-file-path: /tmp/token_savings.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'bench-history'
          # 性能退化告警阈值:> 150% 触发 issue comment(不 fail build)
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
