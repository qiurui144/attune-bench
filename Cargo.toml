[package]
name = "attune-bench"
version = "0.1.0"
edition = "2021"
description = "Quantitative benchmarks for attune algorithm advantages"
license = "Apache-2.0"
repository = "https://github.com/qiurui144/attune-bench"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Local path dep for development. CI / external users should switch to:
#   attune-core = { git = "https://github.com/qiurui144/attune", branch = "develop" }
attune-core = { path = "/data/company/project/attune/rust/crates/attune-core" }
# hdbscan_accuracy bench calls hdbscan crate directly (attune-core 用 Clusterer 包装
# 但 Clusterer 需要 LLM 命名簇；bench 只测算法层 cluster quality).
hdbscan = "0.11"
# v1.1 新 bench 引入：plugin_install.rs YAML parse + SHA-256
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"

# === v1.0 base bench (#131) ===
[[bench]]
name = "token_savings"
harness = false

[[bench]]
name = "encrypt_overhead"
harness = false

[[bench]]
name = "retrieval_accuracy"
harness = false

[[bench]]
name = "hdbscan_accuracy"
harness = false

# === v1.1 新增 bench (#144) ===
[[bench]]
name = "agent_dispatch"
harness = false

[[bench]]
name = "vault_unlock"
harness = false

[[bench]]
name = "chat_e2e"
harness = false

[[bench]]
name = "plugin_install"
harness = false
